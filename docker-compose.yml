services:
  # 1. The Application (PHP + Laravel)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: inventory-app
    container_name: inventory-app
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "chmod -R 777 /var/www/storage /var/www/bootstrap/cache /var/www/database && php-fpm"
    volumes:
      - ./:/var/www
    networks:
      - inventory-network

  # 2. The Web Server (Nginx)
  web:
    image: nginx:alpine
    container_name: inventory-nginx
    restart: unless-stopped
    ports:
      - "8080:80" # We use port 8080 locally to avoid conflicts
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - inventory-network



  # 4. The Frontend Asset Bundler (Vite)
  vite:
    image: inventory-app
    container_name: inventory-vite
    restart: unless-stopped
    working_dir: /var/www
    command: npm run dev
    volumes:
      - ./:/var/www
    ports:
      - "5173:5173"
    depends_on:
      - app
    networks:
      - inventory-network

# Define the network and volume
networks:
  inventory-network:
    driver: bridge


